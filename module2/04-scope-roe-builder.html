<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab: Scope & Rules of Engagement Builder</title>
  <link rel="stylesheet" href="../css/lab-styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Scope & Rules of Engagement Builder</h1>
      <div class="subtitle">Module 2 • Ethical Hacker Pro</div>
    </header>

    <div class="card">
      <div class="progress">Question <span id="qnum">1</span> of 4</div>
      <div class="score-bar"><div class="score-fill" id="scoreFill" style="width:0%"></div></div>

      <div id="questionArea"></div>

      <div id="feedback" class="feedback"></div>

      <button id="nextBtn" class="btn hidden" onclick="nextQuestion()">Next Question</button>
      <div id="finalScore" class="hidden"></div>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "A client emails you: “We want you to test everything. Start as soon as you can. We’re especially worried about our patient portal and the servers in the basement.” What are the major problems with this request? (Select all that apply)",
        type: "multi",
        options: [
          { text: "“Test everything” is far too vague", correct: true },
          { text: "No clear in-scope / out-of-scope definition", correct: true },
          { text: "No authorized testing window or hours", correct: true },
          { text: "No mention of how to handle sensitive patient data", correct: true },
          { text: "The client is allowed to expand scope verbally later", correct: false }
        ],
        feedback: "Correct selections highlight why vague requests create legal and operational risk. Never begin testing until scope and Rules of Engagement are clearly defined in writing."
      },
      {
        question: "Which of the following must be included in a proper Rules of Engagement (RoE) document before any testing begins?",
        type: "multi",
        options: [
          { text: "Clear list of in-scope systems and IP ranges", correct: true },
          { text: "Explicitly out-of-scope systems and activities", correct: true },
          { text: "Authorized testing hours / maintenance windows", correct: true },
          { text: "Emergency contact and “stop testing” procedures", correct: true },
          { text: "Permission to test any newly discovered systems automatically", correct: false }
        ],
        feedback: "A complete RoE protects both the tester and the client. Anything not explicitly authorized should be considered out of scope."
      },
      {
        question: "During the test you discover an unlisted server that appears to belong to a business partner and contains what looks like patient data. It was never mentioned in the scope. What should you do?",
        type: "single",
        options: [
          { text: "Continue testing it because it is on the same network", correct: false },
          { text: "Stop testing that system and immediately notify the client according to the RoE", correct: true },
          { text: "Exploit it fully so you can include the finding in the report", correct: false },
          { text: "Ignore it and only report systems that were originally listed", correct: false }
        ],
        feedback: "Out-of-scope systems and unexpected sensitive data require immediate communication. Continuing could create legal liability."
      },
      {
        question: "The client asks you on Friday afternoon to “just quickly check” an additional cloud environment that was not in the original scope. They promise to update the paperwork next week. What is the correct professional response?",
        type: "single",
        options: [
          { text: "Begin testing immediately to be helpful", correct: false },
          { text: "Decline until the scope and RoE are formally updated and signed", correct: true },
          { text: "Test it but do not include findings in the report", correct: false },
          { text: "Ask for a verbal approval on a recorded call", correct: false }
        ],
        feedback: "Scope changes must be documented and authorized in writing. Verbal or informal expansion creates significant risk for both parties."
      }
    ];

    let current = 0;
    let score = 0;
    let selected = new Set();

    function renderQuestion() {
      const q = questions[current];
      document.getElementById('qnum').textContent = current + 1;
      document.getElementById('scoreFill').style.width = `${(current / questions.length) * 100}%`;

      let html = `<div class="question">${q.question}</div><div class="options">`;

      q.options.forEach((opt, i) => {
        html += `<button class="option-btn" onclick="selectOption(${i})" id="opt${i}">${opt.text}</button>`;
      });

      html += `</div>`;
      document.getElementById('questionArea').innerHTML = html;
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('nextBtn').classList.add('hidden');
      selected.clear();
    }

    function selectOption(index) {
      const q = questions[current];
      const btn = document.getElementById(`opt${index}`);

      if (q.type === 'single') {
        // disable all
        q.options.forEach((_, i) => {
          document.getElementById(`opt${i}`).disabled = true;
        });

        if (q.options[index].correct) {
          btn.classList.add('correct');
          score++;
          showFeedback(true, q.feedback);
        } else {
          btn.classList.add('incorrect');
          // highlight correct one
          q.options.forEach((opt, i) => {
            if (opt.correct) document.getElementById(`opt${i}`).classList.add('correct');
          });
          showFeedback(false, q.feedback);
        }
        document.getElementById('nextBtn').classList.remove('hidden');
      } else {
        // multi-select
        if (selected.has(index)) {
          selected.delete(index);
          btn.classList.remove('selected');
          btn.style.borderColor = '';
          btn.style.background = '';
        } else {
          selected.add(index);
          btn.classList.add('selected');
          btn.style.borderColor = 'var(--accent)';
          btn.style.background = '#eff6ff';
        }
      }
    }

    // For multi-select we need a submit button
    function checkMulti() {
      // This is simplified - in full version add a "Submit Answers" button for multi
    }

    function showFeedback(isCorrect, text) {
      const fb = document.getElementById('feedback');
      fb.textContent = text;
      fb.className = `feedback show ${isCorrect ? 'correct' : 'incorrect'}`;
    }

    function nextQuestion() {
      current++;
      if (current < questions.length) {
        renderQuestion();
      } else {
        finishLab();
      }
    }

    function finishLab() {
      document.getElementById('questionArea').innerHTML = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('nextBtn').classList.add('hidden');
      document.getElementById('scoreFill').style.width = '100%';

      const percent = Math.round((score / questions.length) * 100);
      document.getElementById('finalScore').classList.remove('hidden');
      document.getElementById('finalScore').innerHTML = `
        <h2>Lab Complete</h2>
        <p>You scored <strong>${score} out of ${questions.length}</strong> (${percent}%)</p>
        <p>Strong performance on scoping and Rules of Engagement is one of the most important professional skills in ethical hacking.</p>
        <button class="btn" onclick="location.reload()">Retry Lab</button>
      `;
    }

    // Simple version: treat first question as multi with auto-advance after selection count
    // For production you would add an explicit "Check Answers" button for multi-select questions.
    renderQuestion();
  </script>
</body>
</html>
